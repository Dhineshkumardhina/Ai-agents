services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devforce}
      POSTGRES_USER: ${POSTGRES_USER:-devforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devforce_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devforce-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devforce} -d ${POSTGRES_DB:-devforce}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devforce-network

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: devforce-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-devforce}
      POSTGRES_USER: ${POSTGRES_USER:-devforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devforce_dev_password}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - devforce-network

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: devforce-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - devforce-network

networks:
  devforce-network:
    driver: bridge

volumes:
  devforce-postgres-data:
    driver: local

